<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango Labz - Wiki & Repozytoria</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: rgba(19, 27, 41, 0.75);
      --bg-surface-solid: #131b29;
      --bg-card: rgba(25, 36, 54, 0.6);
      --bg-card-hover: rgba(35, 50, 75, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(255, 140, 0, 0.3);
      --accent-yellow: #FFE033;
      --accent-orange: #FF8C00;
      --accent-red: #E63900;
      --accent-green: #57D638;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-code: "JetBrains Mono", Consolas, monospace;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 140, 0, 0.15), transparent 70%),
        radial-gradient(circle 400px at 85% 20%, rgba(230, 57, 0, 0.08), transparent);
      background-attachment: fixed;
    }

    /* Pasek nawigacji */
    header {
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand-logo-mini { 
      width: 34px; 
      height: 34px; 
      display: flex; 
      align-items: center; 
    }
    .brand-logo-mini img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }

    .brand-text span {
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.7rem;
      cursor: pointer;
      padding: 0.2rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.3rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.25s;
    }

    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(255, 140, 0, 0.2), rgba(230, 57, 0, 0.25));
      color: #ffb74d;
      border: 1px solid rgba(255, 140, 0, 0.4);
    }

    .github-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
    }

    /* RWD dla menu */
    @media (max-width: 768px) {
      .hamburger-btn { display: block; }
      .nav-actions {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(13, 19, 31, 0.98);
        border-bottom: 1px solid var(--border);
        padding: 1.25rem;
        gap: 1rem;
        box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      }
      .nav-actions.open { display: flex; }
      .tabs { flex-direction: column; width: 100%; }
      .tab-btn { width: 100%; text-align: left; padding: 0.75rem 1rem; }
      .github-link-btn { width: 100%; justify-content: center; }
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      flex: 1;
    }

    .tab-content { display: none; animation: fadeIn 0.3s ease forwards; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Sekcja Główna */
    .hero-section {
      padding: 2.5rem 1.5rem 4rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .project-display-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 1.2rem;
      background: rgba(20, 26, 38, 0.8);
      border: 1px solid rgba(255, 140, 0, 0.35);
      border-radius: 999px;
      margin-bottom: 2rem;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .pulse-dot {
      width: 8px; height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .project-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      color: #94a3b8;
    }

    .project-name-text { color: #ff9800; font-size: 1rem; font-weight: 700; }

    .carousel-container {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-glow {
      position: absolute;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255, 140, 0, 0.32) 0%, transparent 70%);
      filter: blur(30px);
    }

    .svg-slide {
      position: absolute;
      width: 100%; height: 100%;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-slide.active { opacity: 1; transform: scale(1); pointer-events: auto; }
    
    .svg-slide img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .svg-slide:hover img {
      transform: scale(1.05) rotate(1deg);
    }

    .carousel-indicators { display: flex; gap: 0.5rem; margin-bottom: 2.2rem; }
    .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); cursor: pointer; }
    .carousel-dot.active { width: 22px; border-radius: 999px; background: #ff9800; }

    .hero-title {
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.85rem;
    }
    .hero-title .main-brand { color: #ffffff; display: block; }
    .hero-title .highlight-text { color: #ff9800; display: block; }

    .hero-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 720px;
      margin-bottom: 2.5rem;
    }

    .hero-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    .btn-primary {
      background: linear-gradient(135deg, #ff9800 0%, #e65100 100%);
      color: #fff;
      font-weight: 700;
      padding: 0.85rem 1.85rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(25, 33, 48, 0.85);
      color: var(--text-main);
      font-weight: 600;
      padding: 0.85rem 1.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    /* Układ Wiki */
    .wiki-layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 2rem;
      min-height: 600px;
    }

    @media (max-width: 860px) {
      .wiki-layout { grid-template-columns: 1fr; }
    }

    .wiki-sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      height: fit-content;
    }

    .wiki-group { margin-bottom: 1.5rem; }
    .wiki-group-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ff9800;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .wiki-list { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
    .wiki-item-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .wiki-item-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .wiki-item-btn.active { background: rgba(255, 140, 0, 0.15); color: #ffb74d; font-weight: 600; }

    .markdown-body {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      line-height: 1.7;
    }
    .markdown-body h1 { color: #ff9800; margin-bottom: 1rem; }
    .markdown-body code { background: rgba(0,0,0,0.4); padding: 0.2rem 0.4rem; border-radius: 4px; color: #ffb74d; }
    .markdown-body pre { background: #080c14; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; }

    /* Repozytoria */
    .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .repo-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
    .repo-card a { color: #ffb74d; text-decoration: none; font-weight: 700; font-size: 1.15rem; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand" onclick="switchTab('home'); return false;">
        <div class="brand-logo-mini">
          <img src="./assets/icon.svg" alt="Mango Labz Logo" />
        </div>
        <div class="brand-text">Mango <span>Labz</span></div>
      </a>

      <button class="hamburger-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>

      <div class="nav-actions" id="nav-actions">
        <nav class="tabs">
          <button class="tab-btn active" id="btn-tab-home" onclick="switchTab('home')">🏠 Główna</button>
          <button class="tab-btn" id="btn-tab-wiki" onclick="switchTab('wiki')">📚 Wiki</button>
          <button class="tab-btn" id="btn-tab-repos" onclick="switchTab('repos')">📦 Repozytoria</button>
        </nav>
        <a href="https://github.com/open-mangos" target="_blank" rel="noopener noreferrer" class="github-link-btn">GitHub</a>
      </div>
    </div>
  </header>

  <main>
    <!-- GŁÓWNA -->
    <section id="tab-home" class="tab-content active">
      <div class="hero-section">
        <a id="project-badge-link" href="https://github.com/open-mangos/Mango-Convert" target="_blank" rel="noopener noreferrer" class="project-display-badge">
          <span class="pulse-dot"></span>
          <span class="project-tag">Projekt</span>
          <span class="project-name-text" id="project-title">Mango-Convert</span>
        </a>

        <!-- Slajdy ładujące pliki SVG z /assets/ -->
        <div class="carousel-container">
          <div class="hero-logo-glow"></div>

          <!-- Slide 1: Mango-Convert -->
          <a class="svg-slide active" data-index="0" data-name="Mango-Convert" href="https://github.com/open-mangos/Mango-Convert" target="_blank" rel="noopener noreferrer">
            <img src="./assets/icon-convert.svg" alt="Mango-Convert" />
          </a>

          <!-- Slide 2: Mango-Cam -->
          <a class="svg-slide" data-index="1" data-name="Mango-Cam" href="https://github.com/open-mangos/Mango-Cam" target="_blank" rel="noopener noreferrer">
            <img src="./assets/icon-cam.svg" alt="Mango-Cam" />
          </a>

          <!-- Slide 3: Mango Labz Core -->
          <a class="svg-slide" data-index="2" data-name="Mango Labz Core" href="https://github.com/open-mangos" target="_blank" rel="noopener noreferrer">
            <img src="./assets/icon-core.svg" alt="Mango Labz Core" />
          </a>
        </div>

        <div class="carousel-indicators">
          <div class="carousel-dot active" onclick="setSlide(0)"></div>
          <div class="carousel-dot" onclick="setSlide(1)"></div>
          <div class="carousel-dot" onclick="setSlide(2)"></div>
        </div>

        <h1 class="hero-title">
          <span class="main-brand">Mango Labz</span>
          <span class="highlight-text">Otwórz sie na nas!</span>
        </h1>

        <p class="hero-desc">Open-Source projekty które pomogą ci w tym cyfrowym świecie.</p>

        <div class="hero-buttons">
          <button class="btn-primary" onclick="switchTab('wiki')">📖 Przejdź do Wiki</button>
          <button class="btn-secondary" onclick="switchTab('repos')">📦 Nasze Repozytoria</button>
        </div>
      </div>
    </section>

    <!-- WIKI -->
    <section id="tab-wiki" class="tab-content">
      <div class="wiki-layout">
        <aside class="wiki-sidebar">
          <div id="wiki-menu"></div>
        </aside>
        <article class="markdown-body" id="wiki-viewer">
          <p>Wybierz dokument...</p>
        </article>
      </div>
    </section>

    <!-- REPOZYTORIA -->
    <section id="tab-repos" class="tab-content">
      <div class="repo-grid" id="repos-container"></div>
    </section>
  </main>

  <script>
    // Nawigacja mobilna
    function toggleMenu() {
      document.getElementById("nav-actions").classList.toggle("open");
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));

      const targetBtn = document.getElementById(`btn-tab-${tabId}`);
      if (targetBtn) targetBtn.classList.add("active");

      const targetSection = document.getElementById(`tab-${tabId}`);
      if (targetSection) targetSection.classList.add("active");

      document.getElementById("nav-actions").classList.remove("open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Karuzela
    let currentSlide = 0;
    const slides = document.querySelectorAll(".svg-slide");
    const dots = document.querySelectorAll(".carousel-dot");
    const titleEl = document.getElementById("project-title");
    const badgeLink = document.getElementById("project-badge-link");

    function setSlide(index) {
      if (!slides[index]) return;
      slides.forEach(s => s.classList.remove("active"));
      dots.forEach(d => d.classList.remove("active"));

      currentSlide = index;
      slides[currentSlide].classList.add("active");
      dots[currentSlide].classList.add("active");

      titleEl.textContent = slides[currentSlide].getAttribute("data-name");
      badgeLink.href = slides[currentSlide].getAttribute("href");
    }

    setInterval(() => {
      setSlide((currentSlide + 1) % slides.length);
    }, 4000);

    /* ========================================================
       WIKI: POGRUPOWANE NA PODFOLDERY
       ======================================================== */
    const wikiStructure = [
      {
        repoName: "Mango-Convert",
        folder: "mango-convert",
        posts: [
          { file: "intro.md", title: "Wprowadzenie i formaty" },
          { file: "uzycie.md", title: "Instrukcja użycia" }
        ]
      },
      {
        repoName: "Mango-Cam",
        folder: "mango-cam",
        posts: [
          { file: "konfiguracja.md", title: "Konfiguracja kamery" },
          { file: "api.md", title: "Protokół i endpointy" }
        ]
      },
      {
        repoName: "Open-Mangos Core",
        folder: "core",
        posts: [
          { file: "instalacja.md", title: "Kompilacja silnika" },
          { file: "baza.md", title: "Zarządzanie bazą danych" }
        ]
      }
    ];

    function initWiki() {
      const menu = document.getElementById("wiki-menu");
      menu.innerHTML = "";
      let firstLoad = true;

      wikiStructure.forEach(group => {
        const grpEl = document.createElement("div");
        grpEl.className = "wiki-group";
        grpEl.innerHTML = `<div class="wiki-group-title">📁 ${group.repoName}</div>`;

        const ul = document.createElement("ul");
        ul.className = "wiki-list";

        group.posts.forEach(post => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.className = "wiki-item-btn";
          btn.textContent = post.title;
          const relativePath = `./wiki/post/${group.folder}/${post.file}`;

          btn.onclick = () => loadMarkdown(relativePath, btn);
          li.appendChild(btn);
          ul.appendChild(li);

          if (firstLoad) {
            btn.classList.add("active");
            loadMarkdown(relativePath, btn);
            firstLoad = false;
          }
        });

        grpEl.appendChild(ul);
        menu.appendChild(grpEl);
      });
    }

    async function loadMarkdown(path, btn) {
      const viewer = document.getElementById("wiki-viewer");
      document.querySelectorAll(".wiki-item-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`HTTP ${res.status}: Brak pliku ${path}`);
        viewer.innerHTML = marked.parse(await res.text());
      } catch (err) {
        viewer.innerHTML = `<h3>Błąd wczytywania</h3><p style="color:#ef4444">${err.message}</p>`;
      }
    }

    // Repozytoria
    async function loadRepos() {
      const container = document.getElementById("repos-container");
      try {
        const res = await fetch("https://api.github.com/orgs/open-mangos/repos");
        if (!res.ok) throw new Error();
        const data = await res.json();
        container.innerHTML = data.map(r => `
          <div class="repo-card">
            <a href="${r.html_url}" target="_blank">${r.name}</a>
            <p style="color:#94a3b8; margin-top:0.5rem;">${r.description || "Brak opisu."}</p>
          </div>
        `).join("");
      } catch {
        container.innerHTML = `
          <div class="repo-card"><a href="https://github.com/open-mangos/Mango-Convert" target="_blank">Mango-Convert</a><p style="color:#94a3b8; margin-top:0.5rem;">Narzędzie do automatycznej konwersji i migracji formatów plików.</p></div>
          <div class="repo-card"><a href="https://github.com/open-mangos/Mango-Cam" target="_blank">Mango-Cam</a><p style="color:#94a3b8; margin-top:0.5rem;">Moduł do rejestracji i manipulacji widokiem kamery.</p></div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initWiki();
      loadRepos();
    });
  </script>
</body>
</html>

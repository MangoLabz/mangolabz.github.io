<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open-MaNGOS - Wiki & Repozytoria</title>
  <!-- Parser Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-base: #0f141c;
      --bg-surface: #18202c;
      --bg-hover: #222d3d;
      --border: #283548;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-code: "JetBrains Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Nawigacja */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand span {
      color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--border);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Główny kontener */
    main {
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Widok repozytoriów */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .repo-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .repo-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .repo-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .repo-title a {
      color: var(--accent);
      text-decoration: none;
    }

    .repo-title a:hover {
      text-decoration: underline;
    }

    .repo-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      line-height: 1.4;
      flex-grow: 1;
    }

    .repo-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Układ Wiki */
    .wiki-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      min-height: 500px;
    }

    @media (max-width: 768px) {
      .wiki-layout {
        grid-template-columns: 1fr;
      }
    }

    .wiki-sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      height: fit-content;
    }

    .wiki-sidebar h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .wiki-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .wiki-item-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .wiki-item-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .wiki-item-btn.active {
      background: var(--border);
      color: var(--accent);
      font-weight: 600;
    }

    /* Wyrenderowany Markdown */
    .markdown-body {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      line-height: 1.6;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--text-main);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .markdown-body h1 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      color: var(--accent);
    }

    .markdown-body p {
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.25rem;
    }

    .markdown-body code {
      font-family: var(--font-code);
      background: var(--bg-base);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
      border: 1px solid var(--border);
    }

    .markdown-body pre {
      background: var(--bg-base);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      border: none;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .status-msg {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <span>🥭</span> Open-MaNGOS
      </a>
      <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('wiki')">Wiki</button>
        <button class="tab-btn" onclick="switchTab('repos')">Repozytoria</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- ZAKŁADKA WIKI -->
    <section id="tab-wiki" class="tab-content active">
      <div class="wiki-layout">
        <aside class="wiki-sidebar">
          <h3>Dokumenty (.md)</h3>
          <ul class="wiki-list" id="wiki-menu">
            <!-- Wpisy ładowane przez JS -->
          </ul>
        </aside>
        <article class="markdown-body" id="wiki-viewer">
          <p class="status-msg">Wybierz dokument z listy obok...</p>
        </article>
      </div>
    </section>

    <!-- ZAKŁADKA REPOZYTORIA -->
    <section id="tab-repos" class="tab-content">
      <div class="repo-grid" id="repos-container">
        <p class="status-msg">Wczytywanie repozytoriów z GitHuba...</p>
      </div>
    </section>
  </main>

  <script>
    /* ========================================================
       1. KONFIGURACJA DOKUMENTÓW WIKIPEDII (./wiki/post/)
       
       Ponieważ przeglądarka nie ma dostępu do listowania katalogów 
       na dysku/serwerze, wpisz tutaj nazwy plików z folderu:
       ======================================================== */
    const wikiPosts = [
      { id: "intro.md", title: "Wprowadzenie i Wymagania" },
      { id: "instalacja.md", title: "Kompilacja i Instalacja" },
      { id: "baza-danych.md", title: "Konfiguracja Bazy Danych" },
      { id: "ekstrakcja.md", title: "DBC, Maps, VMAP & MMAPS" }
    ];

    const GITHUB_ORG = "open-mangos";

    // Przełączanie zakładek
    function switchTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));

      document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add("active");
      document.getElementById(`tab-${tabId}`).classList.add("active");
    }

    // Inicjalizacja menu Wiki
    function initWikiMenu() {
      const menu = document.getElementById("wiki-menu");
      menu.innerHTML = "";

      wikiPosts.forEach((post, index) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.className = "wiki-item-btn";
        btn.textContent = post.title;
        btn.onclick = () => loadMarkdown(post.id, btn);
        li.appendChild(btn);
        menu.appendChild(li);

        // Automatyczne załadowanie pierwszego wpisu
        if (index === 0) {
          btn.classList.add("active");
          loadMarkdown(post.id, btn);
        }
      });
    }

    // Pobieranie i parsowanie pliku .md
    async function loadMarkdown(filename, activeBtn) {
      const viewer = document.getElementById("wiki-viewer");
      viewer.innerHTML = `<p class="status-msg">Ładowanie pliku: ${filename}...</p>`;

      document.querySelectorAll(".wiki-item-btn").forEach(b => b.classList.remove("active"));
      if (activeBtn) activeBtn.classList.add("active");

      try {
        const response = await fetch(`./wiki/post/${filename}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Nie znaleziono pliku ./wiki/post/${filename}`);
        }
        const markdownText = await response.text();
        viewer.innerHTML = marked.parse(markdownText);
      } catch (err) {
        viewer.innerHTML = `
          <h2>Błąd wczytywania dokumentu</h2>
          <p style="color: #ef4444;">${err.message}</p>
          <blockquote>
            <strong>Uwaga:</strong> Pliki Markdown muszą znajdować się w relatywnej ścieżce:
            <code>./wiki/post/${filename}</code>.<br><br>
            Pamiętaj, że zapytania <code>fetch()</code> są blokowane przez protokół <code>file://</code> (CORS).
            Otwórz ten plik przez lokalny serwer HTTP (np. Nginx, rozszerzenie Live Server w VSCode lub <code>python -m http.server</code>).
          </blockquote>
        `;
      }
    }

    // Pobieranie repozytoriów z GitHub API
    async function loadGithubRepos() {
      const container = document.getElementById("repos-container");

      try {
        const res = await fetch(`https://api.github.com/orgs/${GITHUB_ORG}/repos?sort=updated&per_page=30`);
        if (!res.ok) throw new Error("Limit zapytań lub błędna organizacja");

        const repos = await res.json();
        container.innerHTML = "";

        if (repos.length === 0) {
          container.innerHTML = "<p class='status-msg'>Brak publicznych repozytoriów w organizacji.</p>";
          return;
        }

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "repo-card";
          card.innerHTML = `
            <div>
              <div class="repo-title">
                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
              </div>
              <p class="repo-desc">${repo.description || "Brak opisu repozytorium."}</p>
            </div>
            <div class="repo-meta">
              <span>⭐ ${repo.stargazers_count}</span>
              <span>🍴 ${repo.forks_count}</span>
              <span>${repo.language || "Brak danych"}</span>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        // Zestaw zapasowy, jeśli API zablokuje zapytanie
        container.innerHTML = `
          <div class="repo-card">
            <div>
              <div class="repo-title">
                <a href="https://github.com/mangoszero" target="_blank">MangosZero (Vanilla 1.12)</a>
              </div>
              <p class="repo-desc">Rdzeń serwera dedykowany dla wersji World of Warcraft Classic (1.12.1 / 1.12.2).</p>
            </div>
            <div class="repo-meta">
              <span>C++</span>
              <span>Classic</span>
            </div>
          </div>
          <div class="repo-card">
            <div>
              <div class="repo-title">
                <a href="https://github.com/mangostwo" target="_blank">MangosTwo (WotLK 3.3.5a)</a>
              </div>
              <p class="repo-desc">Otwarty silnik gry emulujący dodatek Wrath of the Lich King.</p>
            </div>
            <div class="repo-meta">
              <span>C++</span>
              <span>WotLK</span>
            </div>
          </div>
        `;
      }
    }

    // Uruchomienie skryptu
    window.addEventListener("DOMContentLoaded", () => {
      initWikiMenu();
      loadGithubRepos();
    });
  </script>
</body>
</html>
